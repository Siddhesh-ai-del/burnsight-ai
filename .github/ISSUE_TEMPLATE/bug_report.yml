name: Bug report
description: Report reproducible incorrect behavior
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Redact any telemetry or parameter values you are not authorized to share.
        Burn-in data is frequently proprietary or export-controlled.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Observed behavior versus expected behavior.
      placeholder: The triage engine returned Green for a component whose forecast exceeded the USL.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Exact input file (or a minimal synthetic equivalent) and commands.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, commit hash.
      placeholder: Linux, Python 3.14, commit abc1234
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I have redacted proprietary telemetry from this report.
          required: true
        - label: This is not a security vulnerability (those go through private reporting).
          required: true
